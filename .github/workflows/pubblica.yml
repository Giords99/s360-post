name: Pubblica su Instagram

on:
  # Lun-Ven, ogni 30 minuti tra le 11 e le 18 ora italiana (dopo le 15 servono per le storie di riserva) (GitHub ragiona in UTC).
  # Lo script pubblica solo i post del calendario arrivati all'ora prevista.
  schedule:
    - cron: '7,37 10-16 * * 1-5'
  # Appena cambia il calendario (es. una Notizia approvata da pubblicare subito)
  push:
    branches: [main]
    paths: ['calendario.json']
  # Avvio a mano dalla scheda Actions (per la prova a secco)
  workflow_dispatch:
    inputs:
      azione:
        description: 'Cosa fare'
        type: choice
        required: true
        default: 'Prova a secco (non pubblica)'
        options:
          - 'Prova a secco (non pubblica)'
          - 'Pubblica i post del calendario'
      cartella:
        description: 'Solo per la prova a secco: cartella da controllare'
        required: false
        default: 'post/_prova'

permissions:
  contents: write

concurrency:
  group: pubblica-instagram
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    env:
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      IG_TOKEN_REEL: ${{ secrets.IG_TOKEN_REEL }}
      IG_USER_ID: '17841422521205896'
      CARTELLA_PROVA: ${{ inputs.cartella }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prova a secco (non pubblica)
        if: github.event_name == 'workflow_dispatch' && inputs.azione == 'Prova a secco (non pubblica)'
        run: python pubblica.py --prova "$CARTELLA_PROVA"

      - name: Pubblica i post del calendario
        if: github.event_name == 'schedule' || github.event_name == 'push' || inputs.azione == 'Pubblica i post del calendario'
        run: python pubblica.py

      - name: Salva il calendario aggiornato
        if: always() && (github.event_name == 'schedule' || github.event_name == 'push' || inputs.azione == 'Pubblica i post del calendario')
        run: |
          git config user.name "s360-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendario.json
          git diff --cached --quiet || (git commit -m "Calendario aggiornato dopo la pubblicazione" && git push)
