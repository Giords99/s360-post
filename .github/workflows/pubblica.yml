name: Pubblica su Instagram

on:
  # Lun-Ven, ogni 30 minuti tra le 11 e le 15 ora italiana (GitHub ragiona in UTC).
  # Lo script pubblica solo i post del calendario arrivati all'ora prevista.
  schedule:
    - cron: '7,37 10-13 * * 1-5'
  # Avvio a mano dalla scheda Actions (per la prova a secco)
  workflow_dispatch:
    inputs:
      prova:
        description: 'Cartella da provare SENZA pubblicare. Svuota il campo per eseguire il calendario vero.'
        required: false
        default: 'post/_prova'

permissions:
  contents: write

concurrency:
  group: pubblica-instagram
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    env:
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      IG_USER_ID: '17841422521205896'
      CARTELLA_PROVA: ${{ inputs.prova }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prova a secco (non pubblica)
        if: github.event_name == 'workflow_dispatch' && inputs.prova != ''
        run: python pubblica.py --prova "$CARTELLA_PROVA"

      - name: Pubblica i post del calendario
        if: github.event_name == 'schedule' || inputs.prova == ''
        run: python pubblica.py

      - name: Salva il calendario aggiornato
        if: always() && (github.event_name == 'schedule' || inputs.prova == '')
        run: |
          git config user.name "s360-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendario.json
          git diff --cached --quiet || (git commit -m "Calendario aggiornato dopo la pubblicazione" && git push)
